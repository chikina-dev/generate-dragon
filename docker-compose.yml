version: '3.8'
services:
  discord-bot:
    build: .
    environment:
      - NODE_ENV=production
      - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN}
      - DISCORD_BOT_NAME=${DISCORD_BOT_NAME}
      - DRAGON_BODY_IMAGE_PATH=${DRAGON_BODY_IMAGE_PATH}
      - DRAGON_BALLOON_IMAGE_PATH=${DRAGON_BALLOON_IMAGE_PATH}
    volumes:
      - ./public/img:/usr/src/app/public/img
    restart: always
